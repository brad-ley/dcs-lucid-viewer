name: lucid-viewer
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy>=2
  # Avoid MKL/OpenMP DLL collisions with pip PyTorch on Windows.
  - libblas=*=*openblas
  - liblapack=*=*openblas
  - scipy
  - pip
  - pip:
    # Keep bindings, Qt runtime and sip at the versions tested together.
    # viewer_runtime.py loads Windows ICU first so conda's same-named
    # ICU DLL cannot shadow the Windows exports required by Qt.
    - PyQt6==6.11.0
    - PyQt6-Qt6==6.11.1
    - PyQt6-sip==13.11.1
    - pyqtgraph==0.14.0
    - tifffile
    - opencv-python
    - pillow
    # Density Retrieval: material constants and nonlinear Fresnel solver.
    - xraylib
    - torch
    - hotopy==0.25
